x-eureka-client-environment: &eureka-client-environment
  EUREKA_SERVICE_URL: http://eureka1:8080/eureka/,http://eureka2:8080/eureka/,http://eureka3:8080/eureka/

x-service-environment: &service-environment
  <<: *eureka-client-environment
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: database
  SPRING_CONFIG_IMPORT: configserver:http://configserver:8080
  CONFIG_SERVER_URL: http://configserver:8080
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: password

x-discovery-dependencies: &discovery-dependencies
  configserver:
    condition: service_healthy
  eureka1:
    condition: service_healthy
  eureka2:
    condition: service_healthy
  eureka3:
    condition: service_healthy

x-service-dependencies: &service-dependencies
  <<: *discovery-dependencies
  database:
    condition: service_healthy

x-service-healthcheck: &service-healthcheck
  test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

x-eureka-peer: &eureka-peer
  build: ./eurekaserver
  depends_on:
    configserver:
      condition: service_healthy
  healthcheck: *service-healthcheck

x-eureka-environment: &eureka-environment
  SERVER_PORT: "8080"
  SPRING_CONFIG_IMPORT: configserver:http://configserver:8080
  CONFIG_SERVER_URL: http://configserver:8080

services:
  database:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/1-init.sql:ro
      - ./database:/docker-entrypoint-initdb.d/database:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  configserver:
    build: ./configserver
    ports:
      - "8080:8080"
    environment:
      <<: *eureka-client-environment
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: native
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/auth-service/database"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  eureka1:
    <<: *eureka-peer
    hostname: eureka1
    ports:
      - "8761:8080"
    environment:
      <<: *eureka-environment
      SPRING_PROFILES_ACTIVE: peer1

  eureka2:
    <<: *eureka-peer
    hostname: eureka2
    ports:
      - "8762:8080"
    environment:
      <<: *eureka-environment
      SPRING_PROFILES_ACTIVE: peer2

  eureka3:
    <<: *eureka-peer
    hostname: eureka3
    ports:
      - "8763:8080"
    environment:
      <<: *eureka-environment
      SPRING_PROFILES_ACTIVE: peer3

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8080"
    environment:
      <<: *service-environment
      SPRING_APPLICATION_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/auth_db
    depends_on: *service-dependencies
    healthcheck: *service-healthcheck

  user-service:
    build: ./user-service
    ports:
      - "8082:8080"
    environment:
      <<: *service-environment
      SPRING_APPLICATION_NAME: user-service
      SPRING_PROFILES_ACTIVE: database,dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/user_db
    depends_on: *service-dependencies
    healthcheck: *service-healthcheck

  product-service:
    build: ./product-service
    ports:
      - "8083:8080"
    environment:
      <<: *service-environment
      SPRING_APPLICATION_NAME: product-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/product_db
    depends_on: *service-dependencies
    healthcheck: *service-healthcheck

  cart-service:
    build: ./cart-service
    ports:
      - "8084:8080"
    environment:
      <<: *service-environment
      SPRING_APPLICATION_NAME: cart-service
      SPRING_PROFILES_ACTIVE: database,dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/cart_db
    depends_on: *service-dependencies
    healthcheck: *service-healthcheck

  order-service:
    build: ./order-service
    ports:
      - "8085:8080"
    environment:
      <<: *service-environment
      SPRING_APPLICATION_NAME: order-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/order_db
    depends_on: *service-dependencies
    healthcheck: *service-healthcheck

  api-gateway:
    build: ./api-gateway
    ports:
      - "8086:8080"
    environment:
      <<: *eureka-client-environment
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8080
      CONFIG_SERVER_URL: http://configserver:8080
    depends_on: *discovery-dependencies
    healthcheck: *service-healthcheck

volumes:
  postgres-data:
