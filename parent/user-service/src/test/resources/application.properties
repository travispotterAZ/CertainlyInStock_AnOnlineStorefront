# Run the test context against an in-memory H2 database so contextLoads
# does not require Docker Compose or a real PostgreSQL instance.
spring.profiles.active=database
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=jdbc:h2:mem:user-service-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
