spring.application.name=configserver
server.port=8888
spring.profiles.default=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo/

# Config Server starts before Eureka and serves configuration without discovery.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/,http://localhost:8762/eureka/,http://localhost:8763/eureka/}
eureka.instance.prefer-ip-address=true
