# API Gateway routes. URIs default to the host ports published in
# docker-compose.yml so the gateway works when run locally (mvn spring-boot:run).
# The "docker" profile (api-gateway-docker.properties) replaces them with
# Compose service names. Keep the two files' routes in sync.

# Cart Service
spring.cloud.gateway.server.webflux.routes[0].id=cart-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/*/cart,/users/*/cart/**

# User Service
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/certainlyinstock/users,/certainlyinstock/users/**

# Product Service
spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/certainlyinstock/product-service/products,/certainlyinstock/product-service/products/**

# Order Service (serves the payments API at /api/payments)
spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/payments,/api/payments/**
