# Applied when api-gateway runs with the "docker" Spring profile (docker-compose).
# Spring replaces a list as a whole when it is defined in more than one property
# source, so every route is repeated in full here. Only the URIs differ from
# api-gateway.properties.

# Cart Service
spring.cloud.gateway.server.webflux.routes[0].id=cart-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://cart-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/cart/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# User Service
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://user-service:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/certainlyinstock/users,/certainlyinstock/users/**

# Product Service
spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://product-service:8080
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/certainlyinstock/product-service/products,/certainlyinstock/product-service/products/**

# Order Service (serves the payments API at /api/payments)
spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://order-service:8080
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/payments,/api/payments/**
