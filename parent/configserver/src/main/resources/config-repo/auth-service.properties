# Configuration for auth-service only (Keycloak admin access for registration / password reset).
keycloak.base-url=\${KEYCLOAK_BASE_URL:http://localhost:8180}
keycloak.realm=certainlyinstock
keycloak.client-id=auth-service
# Dev-only default matching keycloak/realm-export.json. Override KEYCLOAK_CLIENT_SECRET outside dev.
keycloak.client-secret=\${KEYCLOAK_CLIENT_SECRET:dev-auth-service-secret}
