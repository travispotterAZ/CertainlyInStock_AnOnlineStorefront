# Shared configuration served to all application services.
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info

# All Config Server clients register and fetch the registry, with peer failover.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/,http://localhost:8762/eureka/,http://localhost:8763/eureka/}
eureka.instance.prefer-ip-address=true

# --- Keycloak / JWT validation (every service is an OAuth2 resource server) ---
# The "iss" claim every token must carry. This is the PUBLIC Keycloak URL
# (KC_HOSTNAME in docker-compose) and is the same inside and outside Docker.
spring.security.oauth2.resourceserver.jwt.issuer-uri=\${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/certainlyinstock}
# Where to download the signing keys. Containers reach Keycloak at keycloak:8080
# (KEYCLOAK_JWK_SET_URI is set in docker-compose); outside Docker the default is used.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=\${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/certainlyinstock/protocol/openid-connect/certs}
