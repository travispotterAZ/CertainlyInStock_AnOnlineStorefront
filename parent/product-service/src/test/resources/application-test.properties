spring.cloud.config.enabled=false
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/product.sql
spring.jpa.open-in-view=false

eureka.client.enabled=false

# Placeholder so the JWT decoder bean exists; no Keycloak is contacted in tests.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9/jwks
