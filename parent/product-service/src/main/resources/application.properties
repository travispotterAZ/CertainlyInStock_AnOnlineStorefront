spring.application.name=product-service

# Continue starting while Config Server is not yet available.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Connect to the Compose database through its published port when running locally.
# Compose overrides the URL with jdbc:postgresql://database:5432/product_db.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Table definitions are maintained in ../database/product.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
